name: HF Space keepalive

# Pings both HF Spaces every 5 minutes so the free-tier containers
# do not fall asleep. Both Spaces are checked via authenticated /health.
#
# The solver Space is PRIVATE — anonymous requests get a 404 from HF's
# gateway and never reach the FastAPI app (so they do not count as
# activity either). The keepalive must send Authorization: Bearer
# HF_TOKEN to land on the app and reset the sleep timer.
#
# Required GitHub secret:
#   HF_TOKEN   any HF read token with access to JessyWessy/SolverKA_Sheesh.
#              The existing read token is fine; do not use a write token.
#
# Optional secret:
#   OPS_WEBHOOK_URL   Discord/Slack webhook for failure notifications.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Separate concurrency group from the tracker so they cannot block each
# other. cancel-in-progress: true because a stale ping has no value —
# the next scheduled run is only 5 min away.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      SOLVER_HEALTH_URL: https://jessywessy-solverka-sheesh.hf.space/health
      PROXY_HEALTH_URL:  https://jessywessy-solverproxy.hf.space/health
      HF_TOKEN:          ${{ secrets.HF_TOKEN }}

    steps:
      - name: Ping solver Space (private — needs HF_TOKEN)
        id: solver
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::HF_TOKEN secret is not set — solver Space cannot be pinged"
            exit 1
          fi
          # -f makes curl exit nonzero on HTTP >=400, --retry handles transient
          # cold-start hiccups, -w surfaces the status code in step logs.
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 \
               -H "Authorization: Bearer $HF_TOKEN" \
               -w "\nsolver HTTP %{http_code} (time_total=%{time_total}s)\n" \
               "$SOLVER_HEALTH_URL"

      - name: Ping proxy Space (public)
        id: proxy
        run: |
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 \
               -w "\nproxy HTTP %{http_code} (time_total=%{time_total}s)\n" \
               "$PROXY_HEALTH_URL"

      - name: Notify on failure
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
        run: |
          if [[ -z "$OPS_WEBHOOK_URL" ]]; then
            exit 0
          fi
          curl -fsS -m 10 -X POST "$OPS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"HF Space keepalive failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
